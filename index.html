<!doctype html>
<html lang="en" class="splash-active">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navya Vikas Public School | Visakhapatnam | CBSE School</title>
    <meta name="description" content="Navya Vikas Public School, Visakhapatnam — a CBSE co-educational school nurturing academic excellence, character, and holistic growth since 1985." />
    <meta property="og:title" content="Navya Vikas Public School | Visakhapatnam" />
    <meta property="og:description" content="A premier CBSE co-educational school in Visakhapatnam nurturing academic excellence, character, and holistic growth." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Navya Vikas Public School" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/brand/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:image" content="__SITE_URL__/brand/og-image.png" />
    <meta name="theme-color" content="#8b2828" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Lexend:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="twitter:card" content="summary_large_image">

    <style>
      html, body { margin: 0; background: #f8f5ec; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 28px; background: #f8f5ec;
        transition: transform 0.9s cubic-bezier(0.76, 0, 0.24, 1), border-radius 0.9s ease;
        border-bottom-left-radius: 0; border-bottom-right-radius: 0;
      }
      #splash.splash-out { transform: translateY(-101%); border-bottom-left-radius: 50% 12vh; border-bottom-right-radius: 50% 12vh; }
      #splash .sp-lockup { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
      #splash .sp-logo-wrap { position: relative; width: clamp(64px, 20vw, 88px); flex-shrink: 0; }
      #splash .sp-name { display: flex; flex-direction: column; line-height: 1; opacity: 0; transform: translateX(-12px); animation: sp-name 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards; }
      #splash .sp-name b { font: 800 clamp(24px, 7.2vw, 34px)/1 'Lexend', system-ui, sans-serif; letter-spacing: 0.04em; color: #8b2828; text-transform: uppercase; }
      #splash .sp-name span { margin-top: 7px; font: 600 clamp(10px, 2.8vw, 12px)/1 'Plus Jakarta Sans', system-ui, sans-serif; letter-spacing: 0.22em; color: #a8853f; text-transform: uppercase; }
      @keyframes sp-name { to { opacity: 1; transform: translateX(0); } }
      /* faint full logo underneath, coloured logo grows upward like a plant */
      #splash .sp-logo { display: block; width: 100%; height: auto; }
      #splash .sp-ghost { opacity: 0.12; filter: grayscale(1); }
      #splash .sp-grow {
        position: absolute; inset: 0; clip-path: inset(100% 0 0 0);
        animation: sp-grow 1.9s cubic-bezier(0.45, 0.05, 0.25, 1) 0.25s forwards;
      }
      @keyframes sp-grow { to { clip-path: inset(0 0 0 0); } }
      #splash .sp-wrap-in { animation: sp-pop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
      @keyframes sp-pop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
      #splash .sp-bar { width: min(52vw, 200px); height: 3px; border-radius: 3px; background: rgba(139, 40, 40, 0.14); overflow: hidden; }
      #splash .sp-bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #8b2828, #c3a160); transform: scaleX(0); transform-origin: left; animation: sp-bar 2.1s cubic-bezier(0.4, 0, 0.2, 1) 0.2s forwards; }
      @keyframes sp-bar { to { transform: scaleX(0.92); } }
      #splash.sp-done .sp-bar i { animation: none; transform: scaleX(1); transition: transform 0.3s ease; }
      #splash .sp-tag { margin: 0; font: 600 13px/1.4 'Plus Jakarta Sans', system-ui, sans-serif; letter-spacing: 0.02em; color: #8b2828; opacity: 0; animation: sp-fade 0.8s ease 1.3s forwards; text-align: center; padding: 0 24px; }
      @keyframes sp-fade { to { opacity: 0.75; } }
      /* hold the page's own animations until the splash has left */
      html.splash-active #root *, html.splash-active #root *::before, html.splash-active #root *::after { animation-play-state: paused !important; }
      html.splash-active body { overflow: hidden; }
      @media (prefers-reduced-motion: reduce) {
        #splash .sp-grow { animation-duration: 0.01ms; animation-delay: 0s; }
      }
    </style>
</head>
  <body>
    <!-- Launch screen. Uses /brand/emblem.png. Removed by src/components/Splash logic in App.tsx -->
    <div id="splash" role="status" aria-label="Loading Navya Vikas Public School">
      <div class="sp-lockup sp-wrap-in">
        <div class="sp-logo-wrap">
          <img class="sp-logo sp-ghost" src="/brand/emblem.png" alt="" />
          <img class="sp-logo sp-grow" src="/brand/emblem.png" alt="" />
        </div>
        <div class="sp-name"><b>Navya Vikas</b><span>Public School</span></div>
      </div>
      <div class="sp-bar"><i></i></div>
      <p class="sp-tag">Nurturing Excellence, Inspiring Futures</p>
    </div>
    <script>
      // safety net: never leave the launch screen stuck if the app fails to load
      setTimeout(function () {
        var s = document.getElementById('splash');
        if (s) { s.classList.add('splash-out'); document.documentElement.classList.remove('splash-active'); }
      }, 9000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
